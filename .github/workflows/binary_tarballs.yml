# Upload and test GEMC binary tarballs after CLAS12 systems images deploy successfully.
name: Binary Tarballs

run-name: Triggered by successful deploy workflow
permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: clas12-systems-binary-tarballs-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: [ "Deploy" ]
    types: [ completed ]

jobs:
  discover:
    # 2nd-hop workflow_run (Deploy is itself workflow_run-triggered), so
    # workflow_run.event is always 'workflow_run' here, never 'push'. head_repository
    # carries the original source through the chain, so this both lets same-repo
    # pushes through and blocks untrusted fork-PR chains.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    name: Create Job Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: scan
        name: Build matrix
        run: ci/distros_tags.sh

  smoke-test:
    name: ${{ matrix.label }}
    needs: [ discover ]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.gemc_image }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check GEMC image
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_ENTRYPOINT_SOURCE_ONLY=1
          . /usr/local/bin/docker-entrypoint.sh
          gemc -v
          python3 --version
          meson --version
