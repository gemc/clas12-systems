name: Clas12 Geo Comparison

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ascii-geometry-comparison-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  compare:
    name: Compare ASCII Geometry
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gemc/src:dev-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: clas12-systems

      - name: Download clas12Tags
        uses: actions/checkout@v6
        with:
          repository: gemc/clas12Tags
          ref: meson
          path: clas12Tags

      - name: Install coatjava dependencies
        working-directory: clas12-systems
        run: ./ci/install_coatjava_deps.sh

      - name: Set up coatjava
        working-directory: clas12-systems
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/setup_coatjava.sh

      - name: Configure Python geometry environment
        working-directory: clas12-systems
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'

          export DOCKER_ENTRYPOINT_SOURCE_ONLY=1
          . /usr/local/bin/docker-entrypoint.sh
          export PKG_CONFIG_PATH="${SIM_HOME}/gemc/dev/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"

          meson setup build --wipe -Dbuildtype=release

      - name: Compare generated ASCII geometry
        id: compare
        working-directory: clas12-systems
        shell: bash
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/ascii-geometry-compare.log"
          workdir="$RUNNER_TEMP/ascii-geometry"
          clas12tags="$GITHUB_WORKSPACE/clas12Tags/experiments/clas12"

          set +e
          scripts/compare_ascii_databases.py \
            --clas12tags "$clas12tags" \
            --workdir "$workdir" \
            --keep \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "### ASCII Geometry Comparison"
            echo
            echo "| Detector | Variation | Result | Details |"
            echo "| --- | --- | --- | --- |"

            for script in geometry_src/*/*.py; do
              detector="$(basename "${script%.py}")"
              detector_dir="$(dirname "$script")"
              [[ "$detector_dir" == "geometry_src/$detector" ]] || continue

              emitted=0

              # Detector-level messages (no variation): "<detector>: <message>"
              # e.g. generation failed, missing reference dir, missing/extra variations.
              while IFS= read -r line; do
                [[ -n "$line" ]] || continue
                msg="${line#"$detector": }"
                echo "| ${detector} | — | ❌ fail | ${msg} |"
                emitted=1
              done < <(grep -E "^${detector}: " "$log" || true)

              # Per-variation results: "<detector>/<variation>: ok|differs (...)"
              while IFS= read -r line; do
                [[ -n "$line" ]] || continue
                rest="${line#"$detector"/}"     # "<variation>: <detail>"
                variation="${rest%%:*}"          # "<variation>"
                detail="${rest#*: }"             # "ok (...)" / "differs (...)"
                if [[ "$detail" == ok* ]]; then result="✅ pass"; else result="❌ fail"; fi
                echo "| ${detector} | ${variation} | ${result} | ${detail} |"
                emitted=1
              done < <(grep -E "^${detector}/[^:]+: " "$log" || true)

              if [[ "$emitted" -eq 0 ]]; then
                echo "| ${detector} | — | ❌ fail | no comparison result found |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
