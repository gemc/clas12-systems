# Compare GEMC3 (this repo) digitized output against the GEMC2/clas12Tags reference,
# per supported system, using hipo-histos.
#
# For each system the job:
#   1. builds + installs this repo (ci/build.sh also generates build/clas12.db and hipo-histos),
#   2. runs GEMC3 twice for n_events with the system's committed yaml: once with field and once with
#      -no_field=all (gun comes from the yaml, unchanged),
#   3. downloads the latest clas12Tags reference HIPOs — both <system>_reference.hipo (field) and
#      <system>_reference_nofield.hipo (no field); always latest, see hipo_reference.yml there,
#   4. runs hipo-histos --compare-system against each matching reference/output pair. A histogram
#      mismatch does NOT fail the job — the field and nofield verdicts are reported in the summary
#      only. The job fails solely when a step genuinely errors (build, GEMC3 run, reference download,
#      or a hipo-histos error such as bad args / missing / corrupt input).
#   5. on non-PR runs (push to main / manual dispatch), publishes the GEMC3 HIPO output to this repo's
#      rolling `histo-gemc3` release as <system>_gemc3.hipo and <system>_gemc3_nofield.hipo — mirroring how
#      clas12Tags publishes its reference (hipo_reference.yml). scripts/compare_hipo_references.sh downloads
#      both that GEMC3 release and the clas12Tags reference to reproduce the comparison locally.
#
# n_events is part of the matrix and is reported in the run metrics. DC uses 10,000 events.
name: HIPO Histos Comparison

permissions:
  # write: publish the GEMC3 HIPO output to this repo's rolling release (see publish step).
  contents: write
  packages: read

env:
  # clas12Tags rolling reference release (always latest; not pinned).
  REFERENCE_REPO: gemc/clas12Tags
  REFERENCE_TAG: histo-reference
  # This repo's rolling release holding the GEMC3 HIPO output, published the same way the
  # clas12Tags reference is. scripts/compare_hipo_references.sh downloads from this tag.
  GEMC3_HIPO_TAG: histo-gemc3

concurrency:
  group: hipo-histos-compare-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "geometry_src/**"
      - "plugins/hipo/**"
      - "hipo-histos/**"
      - "meson.build"
      - "meson/**"
      - ".github/workflows/hipo_histos_compare.yml"
  push:
    branches: [ main ]
    paths:
      - "geometry_src/**"
      - "plugins/hipo/**"
      - "hipo-histos/**"
      - "meson.build"
      - "meson/**"
      - ".github/workflows/hipo_histos_compare.yml"
  workflow_dispatch:

jobs:
  compare:
    name: Compare ${{ matrix.system }} (${{ matrix.n_events }} events)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gemc/src:dev-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: dc
            n_events: 20000
          - system: ec
            n_events: 20000
          - system: ftof
            n_events: 20000
          - system: pcal
            n_events: 20000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install coatjava dependencies
        run: ./ci/install_coatjava_deps.sh

      - name: Set up coatjava
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/setup_coatjava.sh

      - name: Build and install
        run: ./ci/build.sh

      - name: Download latest clas12Tags references
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${REFERENCE_REPO}/releases/download/${REFERENCE_TAG}"
          # Public assets — no token needed. Always the latest references (rolling tag).
          # Two variants per system: field (<system>_reference.hipo) and no-field
          # (<system>_reference_nofield.hipo). Local names drop the <system> prefix.
          for variant in field nofield; do
            suffix=""; [[ "$variant" == nofield ]] && suffix="_nofield"
            curl -fSL "${base}/${{ matrix.system }}_reference${suffix}.hipo" \
              -o "$RUNNER_TEMP/reference${suffix}.hipo"
            # Provenance sidecar (source clas12Tags commit, date, n_events) — optional.
            curl -fSL "${base}/${{ matrix.system }}_reference${suffix}.txt" \
              -o "$RUNNER_TEMP/reference${suffix}.txt" || \
              echo "source: unknown" > "$RUNNER_TEMP/reference${suffix}.txt"
          done

      - name: Run GEMC3
        id: gemc
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_ENTRYPOINT_SOURCE_ONLY=1
          . /usr/local/bin/docker-entrypoint.sh
          export PKG_CONFIG_PATH="$PWD/install/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          # GEMC_PLUGIN_PATH must point at the installed plugin prefix (the libdir holding
          # the *.gplugin shared libraries). Prefer the pkg-config plugindir; fall back to
          # the build.sh install libdir. Fail early if it cannot be resolved or is empty.
          plugin_prefix="$(pkg-config --variable=plugindir clas12-systems 2>/dev/null || true)"
          if [[ -z "$plugin_prefix" ]]; then
            plugin_prefix="$PWD/install/lib"
          fi
          if [[ -z "$plugin_prefix" || ! -d "$plugin_prefix" ]]; then
            echo "ERROR: could not resolve GEMC_PLUGIN_PATH (got '$plugin_prefix')" >&2
            exit 1
          fi
          export GEMC_PLUGIN_PATH="$plugin_prefix"
          echo "GEMC_PLUGIN_PATH=$GEMC_PLUGIN_PATH"
          ls -l "$GEMC_PLUGIN_PATH"/*.gplugin

          # The plugins link libccdb.so (ccdb is a CMake subproject built shared), so gemc
          # needs it on the runtime path to dlopen them. Prefer the copy built in this repo
          # (matching ABI); fall back to the image's gemc install.
          ccdb_so="$(find "$PWD/build" "$PWD/install" -name 'libccdb.so*' -print -quit 2>/dev/null || true)"
          if [[ -z "$ccdb_so" ]]; then
            ccdb_so="$(find "$SIM_HOME" -name 'libccdb.so*' -print -quit 2>/dev/null || true)"
          fi
          if [[ -n "$ccdb_so" ]]; then
            export LD_LIBRARY_PATH="$(dirname "$ccdb_so"):${LD_LIBRARY_PATH:-}"
            echo "Added ccdb lib dir to LD_LIBRARY_PATH: $(dirname "$ccdb_so")"
          else
            echo "WARNING: libccdb.so not found; plugin dlopen may fail" >&2
          fi

          workdir="geometry_src/${{ matrix.system }}"
          cd "$workdir"
          # GEMC3 GOptions take CLI overrides as -key=value (a bare -key is parsed as an
          # unknown switch). n = number of events, sql = geometry database path.
          run_gemc_variant() {
            local variant="$1"
            shift
            gemc "${{ matrix.system }}.yaml" \
              -n="${{ matrix.n_events }}" \
              -sql="$GITHUB_WORKSPACE/build/clas12.db" \
              "$@"
            # The hipo gstreamer writes <filename>.hipo (this system's yaml uses <system>_t0).
            # If the hipo is missing, list what was produced — a duplicate gstreamer output
            # name in the yaml (csv and hipo sharing a filename) can drop the hipo stream.
            ls -l "${{ matrix.system }}_t0.hipo" || {
              echo "ERROR: ${{ matrix.system }}_t0.hipo not found. Produced files:" >&2
              ls -l ./*.hipo 2>/dev/null || ls -l
              exit 1
            }
            mv "${{ matrix.system }}_t0.hipo" "$GITHUB_WORKSPACE/${{ matrix.system }}_${variant}.hipo"
          }

          run_gemc_variant field
          run_gemc_variant nofield -no_field=all

      - name: Compare against references
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          hipo_histos="$PWD/install/bin/hipo-histos"

          # Compare each GEMC3 output against the matching clas12Tags reference (field and
          # nofield). Each variant gets its own output dir, log and per-variant verdict.
          # Write outputs inside the workspace: in a container job $RUNNER_TEMP (/__w/_temp)
          # and the runner.temp expression (/home/runner/work/_temp) differ, so artifacts
          # written under RUNNER_TEMP are invisible to the upload-artifact step.
          for variant in field nofield; do
            suffix=""; [[ "$variant" == nofield ]] && suffix="_nofield"
            ref="$RUNNER_TEMP/reference${suffix}.hipo"
            gemc3_hipo="$PWD/${{ matrix.system }}_${variant}.hipo"
            out_dir="$GITHUB_WORKSPACE/${{ matrix.system }}_compare_${variant}"
            mkdir -p "$out_dir/plots"

            # No --fail-on-diff: a histogram mismatch is reported (see the summary diagnostics)
            # but must not fail the job. hipo-histos exits nonzero only on a genuine error (bad
            # args, missing / corrupt input, crash), which fails the step here via pipefail.
            # This image's ROOT lacks the asimage feature, so it cannot write png/jpg — only the
            # .root file and vector formats. Emit PDF plots, which ROOT always writes in batch.
            "$hipo_histos" \
              --compare-system "${{ matrix.system }}" \
              "$ref" "$gemc3_hipo" \
              --label "clas12Tags-${variant}" --label gemc3 \
              --diagnostics --max-integral-diff 0.1 \
              --plot-format pdf \
              -o "$out_dir/${{ matrix.system }}_compare.root" \
              --plot-dir "$out_dir/plots" \
              2>&1 | tee "$out_dir/compare.log"

            # Informational verdict for the summary, derived from the diagnostics line rather
            # than the exit status (a mismatch no longer changes the exit status).
            if grep -q '^Diagnostics: passed' "$out_dir/compare.log"; then
              echo "${variant}_status=0" >> "$GITHUB_OUTPUT"
            else
              echo "${variant}_status=1" >> "$GITHUB_OUTPUT"
            fi
            echo "Plots produced (${variant}):"; ls -l "$out_dir/plots"
          done

      - name: Step summary
        if: ${{ always() }}
        shell: bash
        run: |
          # Render the hipo-histos diagnostic lines ("passed  <name> ...", "failed  <name> ...")
          # as a markdown table with a ✅/❌ status icon per histogram.
          render_diag() {
            local log="$1" diag
            diag="$(grep -E '^(passed|failed)\b' "$log" 2>/dev/null || true)"
            if [[ -z "$diag" ]]; then
              echo "_no diagnostic output_"
              return
            fi
            echo "| Status | Histogram | Details |"
            echo "| :---: | --- | --- |"
            printf '%s\n' "$diag" | awk '{
              status = ($1 == "passed") ? "✅" : "❌";
              name = $2;
              $1 = ""; $2 = ""; sub(/^ +/, "");
              gsub(/\|/, "\\|");
              print "| " status " | `" name "` | " $0 " |";
            }'
          }
          result_icon() { [[ "$1" == "0" ]] && echo "✅ pass" || echo "❌ fail"; }

          nofield_status="${{ steps.compare.outputs.nofield_status }}"
          field_status="${{ steps.compare.outputs.field_status }}"
          field_reference="$(head -n1 "$RUNNER_TEMP/reference.txt" 2>/dev/null || echo unknown)"
          nofield_reference="$(head -n1 "$RUNNER_TEMP/reference_nofield.txt" 2>/dev/null || echo unknown)"
          {
            echo "### HIPO Histos Comparison — ${{ matrix.system }}"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| System | ${{ matrix.system }} |"
            echo "| Events simulated | ${{ matrix.n_events }} |"
            echo "| Reference (field) | $field_reference |"
            echo "| Reference (nofield) | $nofield_reference |"
            echo "| Result vs nofield (informational) | $(result_icon "$nofield_status") |"
            echo "| Result vs field (informational) | $(result_icon "$field_status") |"
            echo
            for variant in nofield field; do
              label="vs ${variant} reference — informational"
              echo "<details><summary>Per-histogram diagnostics ${label}"
              echo "(chi2/ndf, occupied bins, median entries/bin)</summary>"
              echo
              render_diag "$GITHUB_WORKSPACE/${{ matrix.system }}_compare_${variant}/compare.log"
              echo
              echo "</details>"
              echo
            done
            echo "_Comparison plots (PDF) are in the **${{ matrix.system }}-comparison** artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.system }}-comparison
          # Workspace-relative paths: resolve consistently inside the job container.
          # One directory per reference variant (field and nofield).
          path: |
            ${{ matrix.system }}_compare_field
            ${{ matrix.system }}_compare_nofield
          if-no-files-found: warn

      - name: Prepare GEMC3 HIPO release assets
        # Mirror the clas12Tags reference publish (hipo_reference.yml): expose the GEMC3 output
        # under explicit gemc3 names plus a provenance sidecar, so the rolling release reads
        # clearly alongside the clas12Tags reference assets. Skip on PRs, and only when the
        # GEMC3 run produced output (a failed run has nothing to publish).
        if: ${{ github.event_name != 'pull_request' && steps.gemc.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # The Run GEMC3 step moved the outputs to the workspace root as <system>_<variant>.hipo.
          cp "${{ matrix.system }}_field.hipo"   "${{ matrix.system }}_gemc3.hipo"
          cp "${{ matrix.system }}_nofield.hipo" "${{ matrix.system }}_gemc3_nofield.hipo"
          {
            echo "source: ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${GITHUB_REF_NAME})"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "system: ${{ matrix.system }}"
            echo "n_events: ${{ matrix.n_events }}"
            echo "image: ghcr.io/gemc/src:dev-ubuntu-24.04"
            echo "reference (field): $(head -n1 "$RUNNER_TEMP/reference.txt" 2>/dev/null || echo unknown)"
            echo "reference (nofield): $(head -n1 "$RUNNER_TEMP/reference_nofield.txt" 2>/dev/null || echo unknown)"
          } > "${{ matrix.system }}_gemc3.txt"
          cat "${{ matrix.system }}_gemc3.txt"

      - name: Publish rolling GEMC3 HIPO release
        # Publish only from trusted, non-PR runs (push to main or manual dispatch). Fork PRs
        # have a read-only GITHUB_TOKEN and must not (and cannot) write releases. Rolling tag:
        # assets are overwritten on each run, always the latest main output.
        if: ${{ github.event_name != 'pull_request' && steps.gemc.outcome == 'success' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.GEMC3_HIPO_TAG }}
          name: GEMC3 HIPO output (rolling)
          body: |
            Rolling GEMC3 (clas12-systems) HIPO output for hipo-histos comparison against the
            clas12Tags reference. Always the latest main output; assets are overwritten on each run.
          prerelease: true
          files: |
            ${{ matrix.system }}_gemc3.hipo
            ${{ matrix.system }}_gemc3_nofield.hipo
            ${{ matrix.system }}_gemc3.txt
