# Build and test CLAS12 systems natively on macOS (Apple Silicon) against the
# prebuilt GEMC binary tarball.
#
# macOS has no Docker base image, so unlike the Linux Test/Binary Tarballs
# pipeline this does NOT pull a ghcr.io/gemc/src image. It consumes two
# relocatable tarballs published to their projects' "dev" prereleases:
#
#   * gemc/g4install  "macos_tarball"  -> geant4-*-macosx*-arm64.tar.gz
#       Bundles Geant4 + CLHEP + Xerces-C and a relocatable geant4.env. This
#       supplies the Geant4 and CLHEP headers/libs (e.g. CLHEP::RandGauss used
#       by the DC/EC digitization) and geant4-config, at the exact versions
#       GEMC was built against.
#   * gemc/src        "macos_tarball"  -> gemc-*-macosx*-arm64.tar.gz
#       The GEMC install tree (libs, headers and gemc.pc / geant4_core.pc). GEMC
#       links Geant4/CLHEP statically and ships no Geant4 or CLHEP headers, so
#       the g4install tarball above provides them.
#
# It unpacks both, downloads the Geant4 physics data, then compiles and tests
# the CLAS12 systems (plugins + geometry) and repackages the install tree into a
# second relocatable tarball attached to this repository's "dev" prerelease.
name: macOS CLAS12 Systems Tarball

run-name: macOS CLAS12 systems tarball

permissions:
  contents: write

concurrency:
  group: clas12-systems-macos-tarball-${{ github.ref }}
  cancel-in-progress: true

on:
  # Run after gemc/src's macOS GEMC tarball (0 5 * * *) has been attached to its
  # dev release and after this repo's nightly dev release (44 1 * * *) has
  # anchored the "dev" prerelease this job uploads to.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      gemc_tarball_repo:
        description: 'Repository hosting the GEMC macOS tarball release'
        required: false
        default: 'gemc/src'
      gemc_tarball_tag:
        description: 'Release tag holding the GEMC macOS tarball'
        required: false
        default: 'dev'
      geant4_tarball_repo:
        description: 'Repository hosting the Geant4 macOS tarball release'
        required: false
        default: 'gemc/g4install'
      geant4_tarball_tag:
        description: 'Release tag holding the Geant4 macOS tarball'
        required: false
        default: 'dev'

jobs:
  build-tarball:
    name: clas12-systems macos arm64
    # macos-26 (Tahoe) is the latest macOS image; GitHub's macOS runners are
    # Apple Silicon (arm64). The package is tagged with this build host's
    # OSRELEASE, matching the GEMC/Geant4 tarballs it links against.
    runs-on: macos-26
    env:
      TAG_NAME: dev
      GEMC_TARBALL_REPO: ${{ github.event.inputs.gemc_tarball_repo || 'gemc/src' }}
      GEMC_TARBALL_TAG: ${{ github.event.inputs.gemc_tarball_tag || 'dev' }}
      GEANT4_TARBALL_REPO: ${{ github.event.inputs.geant4_tarball_repo || 'gemc/g4install' }}
      GEANT4_TARBALL_TAG: ${{ github.event.inputs.geant4_tarball_tag || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so ci/clas12_plugins_version.sh / git describe behave
          # like the other build jobs, and so git-lfs/coatjava can resolve.
          fetch-depth: 0

      - name: Install build dependencies (Homebrew)
        env:
          # GitHub macOS runners pre-tap aws/azure/hashicorp; newer Homebrew
          # refuses untrusted taps and aborts. We use none of those taps, so
          # skip the trust check and the auto-update tap scan.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # meson/ninja/cmake + pkg-config drive the build; qt/root and
          # zlib/lz4/fmt/zstd/openssl are the libraries the plugins and the
          # ccdb/hipo-cpp subprojects link against. mysql-client satisfies ccdb's
          # unconditional MySQL dependency (FindMySQL via mysql_config). CLHEP and
          # Geant4 come from the g4install tarball, not Homebrew. XQuartz provides
          # the X11/GL runtime the GEMC tarball was built against.
          brew install meson ninja cmake pkg-config qt root zlib lz4 fmt zstd openssl mysql-client
          # coatjava toolchain: Java, Maven, git-lfs (geometry LFS assets) and jq.
          brew install openjdk maven git-lfs jq
          brew install --cask xquartz

      - name: Download GEMC and Geant4 macOS tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          g4dest="${RUNNER_TEMP}/geant4-download"
          mkdir -p "${g4dest}"
          gh release download "${GEANT4_TARBALL_TAG}" \
            --repo "${GEANT4_TARBALL_REPO}" \
            --pattern 'geant4-*-macosx*-arm64.tar.gz' \
            --dir "${g4dest}"
          echo "GEANT4_TARBALL=$(ls "${g4dest}"/geant4-*-macosx*-arm64.tar.gz | head -1)" >> "$GITHUB_ENV"

          gemcdest="${RUNNER_TEMP}/gemc-download"
          mkdir -p "${gemcdest}"
          gh release download "${GEMC_TARBALL_TAG}" \
            --repo "${GEMC_TARBALL_REPO}" \
            --pattern 'gemc-*-macosx*-arm64.tar.gz' \
            --dir "${gemcdest}"
          echo "GEMC_TARBALL=$(ls "${gemcdest}"/gemc-*-macosx*-arm64.tar.gz | head -1)" >> "$GITHUB_ENV"

          ls -l "${g4dest}" "${gemcdest}"

      - name: Unpack tarballs and install Geant4 data
        shell: bash
        run: |
          set -euo pipefail

          # Geant4 + CLHEP + Xerces-C, with a relocatable geant4.env.
          geant4_home="${RUNNER_TEMP}/geant4"
          mkdir -p "${geant4_home}"
          tar -xzf "${GEANT4_TARBALL}" -C "${geant4_home}" --strip-components=1
          # Download the Geant4 physics data so sourcing geant4.env succeeds.
          "${geant4_home}/install_geant4_data.sh"
          echo "GEANT4_HOME=${geant4_home}" >> "$GITHUB_ENV"

          # GEMC install tree. Do NOT run its install_geant4_data.sh / source its
          # gemc.env: the Geant4 data and G4*DATA come from the g4install tarball
          # above, and gemc.env would otherwise point G4*DATA at an empty dir.
          gemc_home="${RUNNER_TEMP}/gemc"
          mkdir -p "${gemc_home}"
          tar -xzf "${GEMC_TARBALL}" -C "${gemc_home}" --strip-components=1
          echo "GEMC_HOME=${gemc_home}" >> "$GITHUB_ENV"

      - name: Set up coatjava
        shell: bash
        env:
          # Authenticate the coatjava "latest release" api.github.com lookup so it
          # is not subject to the anonymous 60 req/hr per-IP limit (HTTP 403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Homebrew's openjdk is keg-only; expose it so java/javac/maven resolve
          # and ci/install_coatjava_deps.sh short-circuits (no apt/dnf on macOS).
          export JAVA_HOME="$(brew --prefix openjdk)"
          export PATH="${JAVA_HOME}/bin:$(brew --prefix git-lfs)/bin:${PATH}"
          ./ci/setup_coatjava.sh

      - name: Build, test and package CLAS12 systems
        id: build
        shell: zsh {0}
        run: |
          set -e

          # --- Activate the relocated Geant4 + CLHEP stack ------------------
          # geant4.env derives all paths from GEANT4_HOME: it puts geant4-config
          # on PATH and exports CLHEP_BASE_DIR / XERCESCROOT and the G4*DATA vars.
          export GEANT4_HOME="${GEANT4_HOME}"
          source "${GEANT4_HOME}/geant4.env"

          # --- Relocate the GEMC tarball's pkg-config files -----------------
          # The GEMC tarball's .pc files embed absolute paths from the runner
          # that built GEMC, so they must be rewritten for THIS runner:
          #
          #   * gemc.pc       prefix -> GEMC_HOME. meson/meson.build's
          #     binary-prefix fallback reads gemc.pc's own prefix= to form the
          #     -L<libdir> it links GEMC's static libs from, so a stale prefix
          #     breaks the link even on the fallback path.
          #   * geant4_core.pc / geant4.pc  (the only geant4_core.pc anywhere;
          #     the Geant4 tarball ships none) hold paths under the GEANT4_HOME
          #     of the GEMC build runner. Geant4, CLHEP and Xerces-C all live
          #     under that one root, so rewriting it to OUR GEANT4_HOME fixes
          #     the include and library paths in a single pass.
          pcdir="${GEMC_HOME}/lib/pkgconfig"

          gemc_pc="${pcdir}/gemc.pc"
          old_gemc_prefix="$(sed -n 's/^prefix=//p' "${gemc_pc}" | head -1)"
          sed -i '' "s|${old_gemc_prefix}|${GEMC_HOME}|g" "${gemc_pc}"

          for pc in geant4_core.pc geant4.pc; do
            f="${pcdir}/${pc}"
            [[ -f "${f}" ]] || continue
            old_prefix="$(sed -n 's/^prefix=//p' "${f}" | head -1)"
            old_geant4_home="$(dirname "$(dirname "${old_prefix}")")"
            sed -i '' "s|${old_geant4_home}|${GEANT4_HOME}|g" "${f}"
          done

          # --- Compose the build environment --------------------------------
          # gemc.pc / geant4_core.pc come from the GEMC tarball; clhep.pc and
          # xerces come from the relocated Geant4 tarball. Homebrew's qt/zlib are
          # keg-only, so add their .pc dirs too.
          export PKG_CONFIG_PATH="${GEMC_HOME}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_PATH="${CLHEP_BASE_DIR}/lib/pkgconfig:${PKG_CONFIG_PATH}"
          export PKG_CONFIG_PATH="${XERCESCROOT}/lib/pkgconfig:${PKG_CONFIG_PATH}"
          for f in qt zlib; do
            export PKG_CONFIG_PATH="$(brew --prefix ${f})/lib/pkgconfig:${PKG_CONFIG_PATH}"
          done
          # gemc on PATH (binary-prefix fallback in meson/meson.build) and qt bin.
          export PATH="${GEMC_HOME}/bin:$(brew --prefix qt)/bin:${PATH}"

          # coatjava toolchain.
          export JAVA_HOME="$(brew --prefix openjdk)"
          export PATH="${JAVA_HOME}/bin:$(brew --prefix git-lfs)/bin:${PATH}"

          # ROOT: thisroot.sh exports ROOTSYS/PATH and the dyld search path so
          # rootcling/root-config are found and the hipo-cpp ROOT tools link.
          source "$(brew --prefix root)/bin/thisroot.sh"

          echo " > gemc        : $(command -v gemc)"
          echo " > geant4-config: $(command -v geant4-config) ($(geant4-config --version))"
          echo " > clhep       : ${CLHEP_BASE_DIR}"
          echo " > root-config : $(command -v root-config) ($(root-config --version))"
          echo " > javac       : $(command -v javac)"

          # --- Resolve the package version tag ------------------------------
          # Mirror gemc/src's osrelease: macosx<major>-clang<major>-<arch>, and
          # tag the package with the Geant4 the GEMC tarball was built against.
          g4ver="$(geant4-config --version)"
          mac_major="$(sw_vers -productVersion | cut -d. -f1)"
          clang_major="$(clang --version | sed -nE 's/.*clang version ([0-9]+).*/\1/p' | head -1)"
          osrelease="macosx${mac_major}-clang${clang_major}-arm64"
          c12s_ver="$(ci/clas12_plugins_version.sh)"
          echo "CLAS12 systems version: ${c12s_ver}"
          echo "Geant4 version:         ${g4ver}"
          echo "OSRELEASE:              ${osrelease}"

          # --- Compile + install + test -------------------------------------
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          jobs=$(( jobs < 16 ? jobs : 16 ))
          install_prefix="${PWD}/install"

          meson setup build --wipe --prefix="${install_prefix}" -Dbuildtype=release
          meson compile -C build -j "${jobs}"
          meson install -C build
          meson test -C build --suite clas12 --print-errorlogs --no-rebuild \
            --num-processes 1 -v

          # --- Repackage the install tree into a relocatable tarball ---------
          package_name="clas12-systems-${c12s_ver}-geant4-${g4ver}-${osrelease}"
          dist="${PWD}/dist"
          stage="$(mktemp -d)"
          mkdir -p "${dist}"
          cp -a "${install_prefix}" "${stage}/${package_name}"
          tar -C "${stage}" -czf "${dist}/${package_name}.tar.gz" "${package_name}"
          rm -rf "${stage}"

          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/${package_name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Inspect the CLAS12 systems tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball="${{ steps.build.outputs.tarball }}"
          work="$(mktemp -d)"
          tar -xzf "${tarball}" -C "${work}" --strip-components=1
          # Structural check: at least one installed GEMC plugin is present.
          ls -R "${work}/lib" | head -40
          find "${work}" -name '*.gplugin' -o -name '*.dylib' | head -20

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: clas12-systems-tarball-${{ steps.build.outputs.package_name }}
          path: ${{ steps.build.outputs.tarball }}
          if-no-files-found: error

      - name: Attach tarball to dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tarball="${{ steps.build.outputs.tarball }}"
          gh release view "${TAG_NAME}" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "${TAG_NAME}" \
              --repo "$REPO" \
              --title "CLAS12 Systems Dev Nightly" \
              --prerelease \
              --notes "Dev nightly release."
          gh release upload "${TAG_NAME}" --repo "$REPO" "${tarball}" --clobber
