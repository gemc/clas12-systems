# Build and test CLAS12 systems natively on macOS (Apple Silicon).
#
# Download the relocatable Geant4 + CLHEP + Xerces-C tarball from gemc/g4install,
# then compile GEMC from the gemc subproject alongside the CLAS12 plugins and
# geometry. The combined install tree is attached to this repo's dev prerelease.
name: macOS CLAS12 Systems Tarball

run-name: macOS CLAS12 systems tarball

permissions:
  contents: write

concurrency:
  group: clas12-systems-macos-tarball-${{ github.ref }}
  cancel-in-progress: true

on:
  # Run after g4install's macOS Geant4 tarball (0 2 * * *) and this repo's
  # nightly dev release (44 1 * * *) have published their prerequisites.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      geant4_tarball_repo:
        description: 'Repository hosting the Geant4 macOS tarball release'
        required: false
        default: 'gemc/g4install'
      geant4_tarball_tag:
        description: 'Release tag holding the Geant4 macOS tarball'
        required: false
        default: 'dev'

jobs:
  build-tarball:
    name: clas12-systems macos arm64
    # macos-26 (Tahoe) is the latest macOS image; GitHub's macOS runners are
    # Apple Silicon (arm64). The package is tagged with this build host's
    # OSRELEASE, matching the GEMC/Geant4 tarballs it links against.
    runs-on: macos-26
    env:
      TAG_NAME: dev
      GEANT4_TARBALL_REPO: ${{ github.event.inputs.geant4_tarball_repo || 'gemc/g4install' }}
      GEANT4_TARBALL_TAG: ${{ github.event.inputs.geant4_tarball_tag || 'dev' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so ci/clas12_plugins_version.sh / git describe behave
          # like the other build jobs, and so git-lfs/coatjava can resolve.
          fetch-depth: 0

      - name: Install build dependencies (Homebrew)
        env:
          # GitHub macOS runners pre-tap aws/azure/hashicorp; newer Homebrew
          # refuses untrusted taps and aborts. We use none of those taps, so
          # skip the trust check and the auto-update tap scan.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # meson/ninja/cmake + pkg-config drive the build; qt/root and
          # zlib/lz4/fmt/zstd/openssl are the libraries the plugins and the
          # ccdb/hipo-cpp subprojects link against. sqlite/expat/tbb are also
          # needed to compile GEMC. mysql-client satisfies ccdb's
          # unconditional MySQL dependency (FindMySQL via mysql_config). CLHEP and
          # Geant4 come from the g4install tarball, not Homebrew. XQuartz provides
          # the X11/GL headers and runtime used by Geant4 and GEMC.
          brew install meson ninja cmake pkg-config qt root sqlite expat zlib tbb \
            lz4 fmt zstd openssl mysql-client
          # coatjava toolchain: Java, Maven, git-lfs (geometry LFS assets) and jq.
          brew install openjdk maven git-lfs jq
          brew install --cask xquartz

      - name: Download the Geant4 macOS tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Releases may retain builds for older Geant4 or compiler versions.
          # Select the first configured Geant4 version and this runner's build tag.
          source ci/tags_config.sh
          read -r -a geant4_versions <<< "$(get_geant4_tags)"
          g4ver="${geant4_versions[0]}"
          mac_major="$(sw_vers -productVersion | cut -d. -f1)"
          clang_major="$(clang --version | sed -nE 's/.*clang version ([0-9]+).*/\1/p' | head -1)"
          pattern="geant4-${g4ver}-macosx${mac_major}-clang${clang_major}-arm64.tar.gz"

          g4dest="${RUNNER_TEMP}/geant4-download"
          mkdir -p "${g4dest}"
          if ! gh release download "${GEANT4_TARBALL_TAG}" \
            --repo "${GEANT4_TARBALL_REPO}" --pattern "${pattern}" --dir "${g4dest}"; then
            echo "::error::Cannot download ${pattern} from ${GEANT4_TARBALL_REPO}@${GEANT4_TARBALL_TAG}."
            echo "Run the macOS Geant4 tarball workflow in that repository and confirm its release upload."
            gh release view "${GEANT4_TARBALL_TAG}" --repo "${GEANT4_TARBALL_REPO}" \
              --json assets --jq '.assets[].name' || true
            exit 1
          fi
          test -f "${g4dest}/${pattern}"
          echo "GEANT4_TARBALL=${g4dest}/${pattern}" >> "$GITHUB_ENV"
          ls -l "${g4dest}"

      - name: Unpack Geant4 and install its data
        shell: bash
        run: |
          set -euo pipefail

          # Geant4 + CLHEP + Xerces-C, with a relocatable geant4.env.
          geant4_home="${RUNNER_TEMP}/geant4"
          mkdir -p "${geant4_home}"
          tar -xzf "${GEANT4_TARBALL}" -C "${geant4_home}" --strip-components=1
          # Download the Geant4 physics data so sourcing geant4.env succeeds.
          "${geant4_home}/install_geant4_data.sh"
          echo "GEANT4_HOME=${geant4_home}" >> "$GITHUB_ENV"

      - name: Set up coatjava
        shell: bash
        env:
          # Authenticate the coatjava "latest release" api.github.com lookup so it
          # is not subject to the anonymous 60 req/hr per-IP limit (HTTP 403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Homebrew's openjdk is keg-only; expose it so java/javac/maven resolve
          # and ci/install_coatjava_deps.sh short-circuits (no apt/dnf on macOS).
          export JAVA_HOME="$(brew --prefix openjdk)"
          export PATH="${JAVA_HOME}/bin:$(brew --prefix git-lfs)/bin:${PATH}"
          ./ci/setup_coatjava.sh

      - name: Build, test and package CLAS12 systems
        id: build
        shell: zsh {0}
        run: |
          set -e

          # --- Activate the relocated Geant4 + CLHEP stack ------------------
          # geant4.env derives all paths from GEANT4_HOME: it puts geant4-config
          # on PATH and exports CLHEP_BASE_DIR / XERCESCROOT and the G4*DATA vars.
          export GEANT4_HOME="${GEANT4_HOME}"
          source "${GEANT4_HOME}/geant4.env"

          # --- Compose the build environment --------------------------------
          # GEMC's subproject generates geant4_core.pc from geant4-config.
          # Expose CLHEP/Xerces-C and Homebrew's keg-only pkg-config directories.
          export PKG_CONFIG_PATH="${PKG_CONFIG_PATH:-}"
          export PKG_CONFIG_PATH="${CLHEP_BASE_DIR}/lib/pkgconfig:${PKG_CONFIG_PATH}"
          export PKG_CONFIG_PATH="${XERCESCROOT}/lib/pkgconfig:${PKG_CONFIG_PATH}"
          for f in qt sqlite expat zlib; do
            export PKG_CONFIG_PATH="$(brew --prefix ${f})/lib/pkgconfig:${PKG_CONFIG_PATH}"
          done
          export PATH="$(brew --prefix qt)/bin:${PATH}"

          # coatjava toolchain.
          export JAVA_HOME="$(brew --prefix openjdk)"
          export PATH="${JAVA_HOME}/bin:$(brew --prefix git-lfs)/bin:${PATH}"

          # ROOT: thisroot.sh exports ROOTSYS/PATH and the dyld search path so
          # rootcling/root-config are found and the hipo-cpp ROOT tools link.
          source "$(brew --prefix root)/bin/thisroot.sh"

          # The installed GEMC used by SRO tests may link shared CLHEP. dyld uses
          # DYLD_LIBRARY_PATH; geant4.env only exports LD_LIBRARY_PATH.
          g4_runtime_libs="${G4INSTALL}/lib:${CLHEP_BASE_DIR}/lib:${XERCESCROOT}/lib"
          export DYLD_LIBRARY_PATH="${g4_runtime_libs}:${DYLD_LIBRARY_PATH:-}"

          echo " > geant4-config: $(command -v geant4-config) ($(geant4-config --version))"
          echo " > clhep       : ${CLHEP_BASE_DIR}"
          echo " > root-config : $(command -v root-config) ($(root-config --version))"
          echo " > javac       : $(command -v javac)"

          # --- Resolve the package version tag ------------------------------
          # Mirror gemc/src's osrelease: macosx<major>-clang<major>-<arch>, and
          # tag the package with the active Geant4 version used to build GEMC.
          g4ver="$(geant4-config --version)"
          mac_major="$(sw_vers -productVersion | cut -d. -f1)"
          clang_major="$(clang --version | sed -nE 's/.*clang version ([0-9]+).*/\1/p' | head -1)"
          osrelease="macosx${mac_major}-clang${clang_major}-arm64"
          c12s_ver="$(ci/clas12_plugins_version.sh)"
          echo "CLAS12 systems version: ${c12s_ver}"
          echo "Geant4 version:         ${g4ver}"
          echo "OSRELEASE:              ${osrelease}"

          # --- Compile + install + test -------------------------------------
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          jobs=$(( jobs < 16 ? jobs : 16 ))
          install_prefix="${PWD}/install"

          meson setup build --wipe --prefix="${install_prefix}" -Dbuildtype=release
          meson compile -C build -j "${jobs}"
          meson install -C build
          meson test -C build --suite clas12 --print-errorlogs --no-rebuild \
            --num-processes 1 -v

          # --- Repackage the install tree into a relocatable tarball ---------
          package_name="clas12-systems-${c12s_ver}-geant4-${g4ver}-${osrelease}"
          dist="${PWD}/dist"
          stage="$(mktemp -d)"
          mkdir -p "${dist}"
          cp -a "${install_prefix}" "${stage}/${package_name}"
          tar -C "${stage}" -czf "${dist}/${package_name}.tar.gz" "${package_name}"
          rm -rf "${stage}"

          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "tarball=dist/${package_name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Inspect the CLAS12 systems tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball="${{ steps.build.outputs.tarball }}"
          work="$(mktemp -d)"
          tar -xzf "${tarball}" -C "${work}" --strip-components=1
          # GEMC is installed from the source subproject alongside the plugins.
          test -x "${work}/bin/gemc"
          shopt -s nullglob
          plugins=("${work}/lib/"*.gplugin)
          (( ${#plugins[@]} > 0 ))
          printf '%s\n' "${plugins[@]}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: clas12-systems-tarball-${{ steps.build.outputs.package_name }}
          path: ${{ steps.build.outputs.tarball }}
          if-no-files-found: error

      - name: Attach tarball to dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tarball="${{ steps.build.outputs.tarball }}"
          gh release view "${TAG_NAME}" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "${TAG_NAME}" \
              --repo "$REPO" \
              --title "CLAS12 Systems Dev Nightly" \
              --prerelease \
              --notes "Dev nightly release."
          gh release upload "${TAG_NAME}" --repo "$REPO" "${tarball}" --clobber
