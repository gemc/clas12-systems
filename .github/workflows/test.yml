# Build and test CLAS12 systems FROM SCRATCH inside published ghcr.io/gemc/g4install images: these
# ship Geant4 only (no GEMC), so GEMC is compiled from source via the gemc subproject. This proves
# CLAS12 systems can be installed without a pre-existing GEMC, consistently with the other workflows.
name: Test

run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_BUILD_SUMMARY: false

concurrency:
  group: clas12-systems-test-${{ github.ref }}
  cancel-in-progress: true

on:
  # Allows the dedicated gemc/src compatibility-test entry point to reuse these jobs.
  workflow_call:

  pull_request:
    paths-ignore:
      - "**/*.md"
  merge_group:
  push:
    branches: [ main ]
    tags: [ '*' ]
    paths-ignore:
      - "**/*.md"

jobs:
  catalogs:
    name: Validate message catalogs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Checkout GEMC catalog tools
        uses: actions/checkout@v6
        with:
          repository: gemc/src
          ref: main
          path: .catalog-tools/gemc
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML
      - name: Check generated plugin catalogs
        run: python .catalog-tools/gemc/ci/extract_messages.py validate-tree --root .

  discover:
    name: Create Job Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix_build: ${{ steps.scan.outputs.matrix_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - id: scan
        name: Build matrix
        run: ci/distros_tags.sh

  build:
    name: ${{ matrix.label }}
    needs: [ discover, catalogs ]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container_image }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix_build) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install coatjava dependencies
        run: ./ci/install_coatjava_deps.sh

      - name: Set up coatjava
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/setup_coatjava.sh

      - name: Build and test
        env:
          GEANT4_TAG: ${{ matrix.geant4_tag }}
        run: ./ci/build.sh

  final:
    name: Test - summary
    if: ${{ always() }}
    needs: [ build, catalogs ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "### Some CLAS12 systems test jobs failed or were cancelled." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Pass
        run: |
          echo "### CLAS12 systems test workflow passed." >> "$GITHUB_STEP_SUMMARY"
