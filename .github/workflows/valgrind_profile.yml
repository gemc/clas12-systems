name: Valgrind Profile

run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}

# Profiles a full CLAS12 configuration (experiments/rga.yaml) under callgrind. All profiling and
# reporting is done by the Callgrinder action (gemc/Callgrinder); this workflow builds the detector
# plugins (with debug symbols) and geometry and hands the command to the action.

on:
  # Weekly, Monday 02:10 UTC. Callgrind is ~50x slower than a native run, so this is not a per-push check.
  workflow_dispatch:
    inputs:
      events:
        description: Number of events to profile (blank keeps the default 100).
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: [ "Test" ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read
  packages: read

concurrency:
  group: clas12-systems-valgrind-profile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: Profile rga
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Debug-symbols gemc image (gemc, Geant4, and CLHEP built with symbols) so callgrind can name
    # their routines. Published by gemc/src Deploy.
    container:
      image: ghcr.io/gemc/src:dev-ubuntu-26.04-debug
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install coatjava dependencies
        run: ./ci/install_coatjava_deps.sh

      - name: Set up coatjava
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci/setup_coatjava.sh

      - name: Install Valgrind
        run: |
          apt-get update
          apt-get install -y valgrind

      - name: Build CLAS12 plugins and geometry (profile build)
        run: ./ci/build.sh profile

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_ENTRYPOINT_SOURCE_ONLY=1
          . /usr/local/bin/docker-entrypoint.sh
          # rga.yaml references 'sql: gemc.sqlite' relative to the working directory; the plugins are
          # discovered through GEMC_PLUGIN_PATH and the clas12-cmag field plugin resolves its maps from
          # <plugindir>/../fields. gemc finds its Geant4 data through the installed package cache.
          {
            echo "GEMC_PLUGIN_PATH=${PWD}/install/lib${GEMC_PLUGIN_PATH:+:${GEMC_PLUGIN_PATH}}"
            echo "PROFILE_WORKDIR=${PWD}/experiments"
          } >> "${GITHUB_ENV}"
          dirname "$(command -v gemc)" >> "${GITHUB_PATH}"

      - name: Profile experiments/rga.yaml
        uses: gemc/Callgrinder@v1
        with:
          mode: profile
          name: rga
          command: gemc rga.yaml -n={events} -nthreads=1
          events: ${{ github.event.inputs.events || '100' }}
          config: ci/callgrinder.json
          working-directory: ${{ env.PROFILE_WORKDIR }}
          output-dir: callgrinder-parts

      - name: Upload profile
        uses: actions/upload-artifact@v7
        with:
          name: callgrinder-rga
          path: callgrinder-parts
          if-no-files-found: error
          retention-days: 30

  guidance:
    name: How to read the profile
    needs: profile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download profile
        uses: actions/download-artifact@v7
        with:
          name: callgrinder-rga
          path: profiles

      - name: Aggregate the category table and qcachegrind guidance
        uses: gemc/Callgrinder@v1
        with:
          mode: report
          input-dir: profiles

      - name: Gate on profile result
        if: needs.profile.result != 'success'
        run: |
          echo "### The profile job did not succeed." >> "$GITHUB_STEP_SUMMARY"
          exit 1
