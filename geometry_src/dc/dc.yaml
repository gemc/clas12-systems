experiment: clas12
runno: 11
nthreads: 12

verbosity:
  - g4system: 1
  - gemc: 1
  - dc: 1


gsystem:
  - name: dc
    factory: sqlite

gstreamer:
  - format: csv
    filename: material
  - format: root
    filename: material

phys_list: FTFP_BERT 

g4camera:
  theta: 120*deg
  phi: 150*deg

gparticle:
