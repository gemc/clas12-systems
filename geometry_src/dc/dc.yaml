experiment: clas12
runno: 11
nthreads: 1

gfields:
 - name: clas12
   type: clas12-cmag
   solenoid: Symm_solenoid_r601_phi1_z1201_13June2018
   torus: Symm_torus_r2501_phi16_z251_24Apr2018
   solenoid_scale: -1
   torus_scale: -1

global_field: clas12

verbosity:
  - g4system: 1
  - gemc: 1
  - dc: 1

gsystem:
  - name: dc
    factory: sqlite

gstreamer:
  - format: csv
    filename: dc
  - format: hipo
    filename: dc

phys_list: FTFP_BERT 

g4camera:
  theta: 120*deg
  phi: 150*deg

gparticle:
  - name: e-
    p: 5000*MeV
    delta_p: 1*GeV
    theta: 25*deg
    delta_theta: 15*deg
    randomThetaModel: cosine
    delta_phi: 180*deg
