experiment: clas12
runno: 11
nthreads: 2

verbosity:
  - g4system: 1
  - gemc: 1
  - dc: 1


gsystem:
  - name: dc
    factory: sqlite

gstreamer:
  - format: csv
    filename: dc
  - format: hipo
    filename: dc

phys_list: FTFP_BERT 

g4camera:
  theta: 120*deg
  phi: 150*deg

gparticle:
  - name: e-
    p: 4000*MeV
    theta: 20*deg
    delta_theta: 10*deg
    delta_phi: 180*deg

