experiment: clas12
runno: 11
nthreads: 1

verbosity:
  - g4system: 1
  - gemc: 1
  - dc: 1

gsystem:
  - name: dc
    factory: sqlite

gstreamer:
  - format: csv
    filename: dc
  - format: hipo
    filename: dc

phys_list: FTFP_BERT 

g4camera:
  theta: 120*deg
  phi: 150*deg

gparticle:
  - name: e-
    p: 5000*MeV
    theta: 25*deg
    delta_p: 1*GeV
    delta_theta: 1*deg
    delta_phi: 180*deg

