experiment: clas12
runno: 11
nthreads: 1

verbosity:
  - g4system: 1
  - gemc: 1
  - ecal: 1

gsystem:
  - name: ec
    factory: sqlite

gstreamer:
  - format: csv
    filename: ec
  - format: hipo
    filename: ec

phys_list: FTFP_BERT

g4camera:
  theta: 120*deg
  phi: 150*deg

gparticle:
  - name: e-
    p: 5000*MeV
    delta_p: 1*GeV
    theta: 25*deg
    delta_theta: 15*deg
    randomThetaModel: cosine
    delta_phi: 180*deg
